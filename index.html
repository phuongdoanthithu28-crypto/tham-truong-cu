<script>
const T=THREE,scene=new T.Scene();
scene.background=new T.Color(0x9fd3f5);scene.fog=new T.Fog(0x9fd3f5,100,280);

function flat(w,d,c,x,y,z){const m=box(w,.02,d,c,x,y,z);m.userData.flat=1;return m}
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return new T.CanvasTexture(c)}
function sign(tx,w,h,x,y,z,p,two){const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tx,side:two?T.DoubleSide:T.FrontSide}));m.position.set(x,y,z);(p||scene).add(m);return m}

  if(f>0){box(w,.25,1.8,0xa0583a,0,y,fz+.9,g);box(w,.9,.1,0xffffff,0,y+.65,fz+1.75,g)}

  if(f>0)for(let x=-w/2+3;x<w/2;x+=6)box(.5,.35,.03,0xd8201f,x,y+1.3,fz+1.85,g);

 if(wing){box(8,3,d+.4,0xf2d98a,0,12.4,0,g);box(8.6,.4,d+1,0xd8203a,0,14.1,0,g)}
 BL.push({cx,cz,fz,hw,rms,names:nms,co:Math.cos(ry),si:Math.sin(ry)});
}

const gateTx2=tex(1024,128,(c,w,h)=>{c.fillStyle='#f6f4ee';c.fillRect(0,0,w,h);c.fillStyle='#1c3f94';c.textAlign='center';c.textBaseline='middle';
 c.font='bold 18px Arial';c.fillText('ỦY BAN NHÂN DÂN THÀNH PHỐ HẢI PHÒNG – SỞ GIÁO DỤC VÀ ĐÀO TẠO',w/2,20,w-30);

 c.fillStyle='#c0392b';c.beginPath();c.arc(64,64,30,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(64,64,14,0,7);c.fill()});

 c.fillText('CỔNG TRƯỜNG',64,28);c.fillText('AN TOÀN GIAO',64,50);c.fillText('THÔNG',64,72);c.beginPath();c.arc(64,100,16,0,7);c.stroke()});

box(13.2,.3,.8,0x7a3a2e,7.9,5.75,26);[2.5,4,5.5,11,12.5,14].forEach(x=>ball(.3,0x4a8f3a,x,6.15,26));

box(.1,2.2,2.6,0x1f6b3a,3.1,1.1,24.7);box(.1,2.2,2.6,0x1f6b3a,7.9,1.1,24.7);box(.1,2.2,1.4,0x1f6b3a,12.4,1.1,25.3);

 for(let r=0;r<4;r++){c.strokeRect(0,r*32,w,32);c.beginPath();for(let k=0;k<2;k++){const x=(k*64+(r%2)*32)%128;c.moveTo(x,r*32);c.lineTo(x,r*32+32)}c.stroke()}});
