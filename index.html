(function connectOnline(){
 const el=document.getElementById('online');
 if(!SUPABASE_URL.startsWith('http')||typeof supabase==='undefined'){el.textContent='🔴 Lỗi tải thư viện kết nối';return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{realtime:{params:{eventsPerSecond:10}}});
 function joinRoom(){
  if(ch)sb.removeChannel(ch);
  ch=sb.channel('thpt-nbk-room',{config:{presence:{key:myId}}});
  ch.on('presence',{event:'sync'},()=>{
   const st=ch.presenceState(),ids=Object.keys(st);
   el.textContent=`🟢 Đang trong trường: ${ids.length} học sinh`;
   Object.keys(others).forEach(id=>{if(!st[id]){scene.remove(others[id].m);delete others[id]}});
   ids.forEach(id=>{if(id===myId)return;const d=st[id][0];
    if(!others[id]){const p=spawnOther(d.n||'Học sinh');p.m.position.set(d.x,d.y||0,d.z);others[id]=Object.assign(p,{tx:d.x,ty:d.y||0,tz:d.z,tr:d.r||0});applyOtherLook(others[id],d)}
    else{others[id].tx=d.x;others[id].ty=d.y||0;others[id].tz=d.z;others[id].tr=d.r||0;applyOtherLook(others[id],d)}
   });
  }).on('broadcast',{event:'chat'},({payload})=>{
   if(payload&&payload.id!==myId)appendLog(payload.n||'Học sinh',payload.m||'');
  }).subscribe((s,err)=>{
   if(s==='SUBSCRIBED'){syncNow()}
   else{el.textContent='🟡 Trạng thái phòng: '+s+(err?' ('+err.message+')':'');if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')setTimeout(joinRoom,3000)}
  });
 }
 joinRoom();
 setInterval(()=>{if(ch&&ch.state==='joined')syncNow()},2000);
})();

let audioCtx=null,bgmOn=false,bgmTimer=null;
const bgmBtn=document.getElementById('bgm');
function playNote(freq,dur,type='sine',vol=.06){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.value=freq;
 g.gain.setValueAtTime(vol,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
 o.connect(g);g.connect(audioCtx.destination);
 o.start();o.stop(audioCtx.currentTime+dur);
}

  bgmTimer=setInterval(()=>{if(bgmOn){playNote(notes[idx++%notes.length],.9,'sine',.045)}},750);
 }else clearInterval(bgmTimer);
};

function enter(i,nm,lx){const o=BL[i].off;ctx={bi:i,f:fl,lx};inside=true;fl=0;IX=o?RX2:RX;if(!o)drawBoard(nm);P.set(IX+2.6,0,5.2);snap=1;subhud.innerHTML='<b>'+(o?(nm?nm.replace('|',' '):'Phòng làm việc'):'Lớp '+nm)+'</b> - Lại gần ghế để ngồi (E). Cửa ra sân ở giữa phía dưới'}
function leave(){sit=null;const b=BL[ctx.bi];inside=false;fl=ctx.f;bi=ctx.bi;place(b,ctx.lx,fl?b.fz+1:b.fz+2.7);subhud.innerHTML=H0;snap=1}

(function tick(){requestAnimationFrame(tick);
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 let ix=(k.ArrowRight||k.KeyD?1:0)-(k.ArrowLeft||k.KeyA?1:0)+jx,iz=(k.ArrowDown||k.KeyS?1:0)-(k.ArrowUp||k.KeyW?1:0)+jz;
 let l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l}if(climb){ix=iz=0;l=0}if(sit&&l>.1)stand();if(pray&&l>.1){pray=null;subhud.innerHTML=H0}if(pray){ix=iz=0;l=0}
 if(l>.1){
  if(poseIdx===1||poseIdx===2)setPose(0);
  const nx=P.x+ix*6*dt,nz=P.z+iz*6*dt;
  if(fl){const b=BL[bi],dx=nx-b.cx,dz=nz-b.cz;let lx=dx*b.co-dz*b.si,lz=dx*b.si+dz*b.co;lx=Math.max(-b.hw+.6,Math.min(b.hw-.6,lx));lz=Math.max(b.fz+.6,Math.min(b.fz+1.5,lz));place(b,lx,lz)}else{if(!hit(nx,P.z))P.x=inside?Math.max(IX-8.4,Math.min(IX+8.4,nx)):Math.max(-95,Math.min(60,nx));
  if(!hit(P.x,nz))P.z=inside?Math.max(-5.9,Math.min(Math.abs(P.x-IX)<1.4?6.8:5.7,nz)):Math.max(-72,Math.min(43,nz))}
  const a=Math.atan2(ix,iz);let d=((a-hero.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;hero.rotation.y+=d*Math.min(1,dt*12);
  ph+=dt*10*Math.min(1,l);
 }else ph*=.8;

 if(py>0||vy>0){py+=vy*dt;vy-=18*dt;if(py<=0){py=0;vy=0}}

 if(climb){const b=BL[climb.i];climb.t+=dt/1.5;const u=Math.min(1,climb.t),sg=climb.to>climb.from?1:-1,lx=sg>0?-1.8+3.6*u:1.8-3.6*u;
  place(b,lx,b.fz+.9);hero.rotation.y=Math.atan2(sg*b.co,-sg*b.si);ph+=dt*12;
  climb.y=3.6*(climb.from+(climb.to-climb.from)*Math.floor(u*12)/12)+.1;
  if(u>=1){fl=climb.to;bi=climb.i;place(b,0,fl?b.fz+1:b.fz+2.7);climb=null;snap=1}}
 let o1=0,o2=0;
 if(inside){if(sit)o1={t:'Đứng dậy (E)',f:stand};else{let bs=null,dm=1.2;SEATS.forEach(s=>{const d=Math.hypot(P.x-s.x,P.z-s.z);if(!s.o&&d<dm){dm=d;bs=s}});if(bs)o1={t:'Ngồi xuống (E)',f:()=>sitDown(bs)}}if(!sit&&P.z>6)leave()}
 else if(!climb)for(let i=0;i<BL.length;i++){const b=BL[i];if(fl&&i!==bi)continue;
  const dx=P.x-b.cx,dz=P.z-b.cz,lx=dx*b.co-dz*b.si,lz=dx*b.si+dz*b.co;
  if(Math.abs(lx)>b.hw||(!fl&&(lz<b.fz+1.5||lz>b.fz+2.8))||(fl&&lz>b.fz+1.7))continue;
  const k2=b.rms.findIndex(r=>Math.abs(lx-r)<1.2);
  if(k2>=0){const nm=b.names[fl][k2],lb=b.off?(nm?nm.replace('|',' ').toLowerCase():'phòng làm việc'):'lớp '+nm;o1={t:'Vào '+lb+' (E)',f:()=>enter(i,nm,b.rms[k2])}}
  else if(Math.abs(lx)<2.4){if(fl<b.floors-1)o1={t:'▲ Lên tầng '+(fl+2)+' (E)',f:()=>go(i,fl+1)};if(fl>0)o2={t:'▼ Xuống '+(fl==1?'sân':'tầng '+fl)+' (Q)',f:()=>go(i,fl-1)}}
  break}
 if(!inside&&!climb&&!sit&&!pray&&!fl&&!o1){
  if(Math.hypot(P.x+2,P.z-6)<2.6)o1={t:'📖 Mở Sổ Lưu Bút (E)',f:openGuestbook};
  else if(P.x>-19.2&&P.x<-12.8&&P.z>5.5&&P.z<8.6)o1={t:'Lạy cụ Nguyễn Bỉnh Khiêm (E)',f:startPray};
 }
 A1=o1;A2=o2;const key=(o1?o1.t:'')+'|'+(o2?o2.t:'');
 if(key!==lastKey){lastKey=key;ab1.style.display=o1?'block':'none';ab2.style.display=o2?'block':'none';ab1.textContent=o1?o1.t:'';ab2.textContent=o2?o2.t:'';act.style.display=(o1||o2)?'flex':'none'}

 hero.rotation.x=0;up.rotation.x=0;armL.rotation.z=armR.rotation.z=0;
 const sw=Math.sin(ph)*(l>.1||climb?.7:0);legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw*.8;armR.rotation.x=sw*.8;
 let poseY=0;
 if(sit){legL.rotation.x=legR.rotation.x=-1.45;armL.rotation.x=armR.rotation.x=-.9}
 else if(poseIdx===1){legL.rotation.x=legR.rotation.x=-1.5;armL.rotation.x=armR.rotation.x=-.5;poseY=-.55}
 else if(poseIdx===2){hero.rotation.x=-Math.PI/2;legL.rotation.x=legR.rotation.x=0;armL.rotation.x=armR.rotation.x=0;poseY=.25}
 else if(poseIdx===3){armR.rotation.x=-2.7;armR.rotation.z=-.35;armL.rotation.x=0}
 else if(poseIdx===4){armL.rotation.z=Math.sin(t*8)*.8+.8;armR.rotation.z=-Math.cos(t*8)*.8-.8;poseY=Math.abs(Math.sin(t*8))*.15}

 if(pray){pray.t+=dt;const t2=pray.t,hs=Math.max(0,Math.min(1,t2/.6,(6-t2)/.6)),bw=(t2>.6&&t2<5.4)?Math.sin(((t2-.6)%1.6)/1.6*Math.PI):0;
  up.rotation.x=bw*1.1;armL.rotation.x=armR.rotation.x=-1.2*hs;armL.rotation.z=.6*hs;armR.rotation.z=-.6*hs;legL.rotation.x=legR.rotation.x=0;
  if(t2>=6){pray=null;subhud.innerHTML=H0}}

 P.y=(climb?climb.y:(fl?3.6*fl+.1:0))+py+poseY+Math.abs(Math.sin(ph))*(l>.1?.05:0);if(sit)P.y=sit.h===undefined?-.38:sit.h;
 flagP.rotation.y=Math.sin(t*3)*.15;

 if(ch&&t-lastSync>.1&&(l>.1||climb||sit||py>0||poseIdx===4)){lastSync=t;syncNow()}
 Object.values(others).forEach(o=>{o.m.position.x+=(o.tx-o.m.position.x)*.18;o.m.position.y+=(o.ty-o.m.position.y)*.18;o.m.position.z+=(o.tz-o.m.position.z)*.18;o.m.rotation.y=o.tr});

 const kf=snap?1:Math.min(1,dt*4);snap=0;cam.position.x+=(P.x-cam.position.x)*kf;cam.position.z+=(P.z+(inside?9:14)-cam.position.z)*kf;cam.position.y=(inside?8:9)+(climb?climb.y:fl?3.6*fl:0);
 cam.lookAt(P.x,P.y+1.5,P.z-1);
 ren.render(scene,cam)})();
</script></body></html>
